<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Savings Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Compound Interest / Savings Calculator</h1>

    <label for="starting-amount">Starting amount ($)</label>
    <input type="number" id="starting-amount">

    <label for="monthly-contribution">Monthly contribution ($)</label>
    <input type="number" id="monthly-contribution">

    <label for="annual-rate">Annual interest rate (%)</label>
    <p class="hint">Typical rates: savings account ~0.5%, high-yield savings ~4%, stock market average (long-term) ~8%</p>
    <input type="number" id="annual-rate">

    <label for="years">Number of years</label>
    <input type="number" id="years">

    <button id="calculate-btn">Calculate</button>

    <p id="result"></p>

    <canvas id="growth-chart"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
